plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven {
        name = "jitpack.io"
        url = "https://jitpack.io"
    }
    maven {
        name = "meteor-maven"
        url = "https://maven.meteordev.org/releases"
    }
    maven {
        name = "lwjgl"
        url = "https://repo.lwjgl.org/releases"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation "meteordevelopment:orbit:0.2.3"
    include(implementation("meteordevelopment:orbit:0.2.3"))
    compileOnly 'org.apiguardian:apiguardian-api:1.1.2'
    
    include(implementation("org.lwjgl:lwjgl-nanovg:3.3.4"))
    include(implementation("org.lwjgl:lwjgl-nanovg:3.3.4:natives-windows"))
    include(implementation("org.lwjgl:lwjgl-nanovg:3.3.4:natives-linux"))
    include(implementation("org.lwjgl:lwjgl-nanovg:3.3.4:natives-macos"))
}

loom {
    accessWidenerPath = file("src/main/resources/troll.accesswidener")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}
